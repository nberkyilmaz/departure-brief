# The relay, as a Cloudflare Worker on the free plan. See docs/deploy.md.
name = "depbrief-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# Every five minutes. Each tick refreshes only what is due — METARs every
# five minutes, TAFs and hazard advisories every fifteen, upper winds hourly
# — which is 600 writes a day against the free plan's 1,000.
[triggers]
crons = ["*/5 * * * *"]

# Created once with `npx wrangler kv namespace create SNAPSHOTS`. Not a
# secret: it names a store only this account can reach.
[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "a23fb8ceb97c40458022b4f4054206ed"

[vars]
# The pages allowed to read from this relay, comma separated. The site is
# served at nberkyilmaz.com/departure-brief/; an Origin carries no path, so
# the domain alone is the whole entry. The GitHub address stays so the page
# still works if the domain is ever detached.
ALLOWED_ORIGINS = "https://nberkyilmaz.com,https://nberkyilmaz.github.io"
# Both weather services ask for a way to reach whoever is calling.
USER_AGENT = "depbrief-relay/0.1 (+https://github.com/nberkyilmaz/departure-brief; contact@nberkyilmaz.com)"
