<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The hold-short marking: two solid lines on the taxiway side, two dashed on the runway side. -->
  <rect width="64" height="64" rx="14" fill="#1d2125"/>
  <g fill="#ffcc00">
    <rect x="10" y="16" width="44" height="5" rx="1"/>
    <rect x="10" y="25" width="44" height="5" rx="1"/>
    <rect x="10" y="34" width="12" height="5" rx="1"/>
    <rect x="26" y="34" width="12" height="5" rx="1"/>
    <rect x="42" y="34" width="12" height="5" rx="1"/>
    <rect x="10" y="43" width="12" height="5" rx="1"/>
    <rect x="26" y="43" width="12" height="5" rx="1"/>
    <rect x="42" y="43" width="12" height="5" rx="1"/>
  </g>
</svg>
