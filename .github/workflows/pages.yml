# Publish the public site to GitHub Pages.
#
# What gets published is static files, but not a static briefing: the page
# carries the recorded reports and runs the pipeline itself, so a visitor
# can change their minimums, the aircraft or the route and watch the verdict
# move. What it cannot do is fetch — neither weather service allows a page
# to call it directly, and a public page that did would be putting load on
# them on behalf of strangers. So the weather is frozen at the moment it was
# recorded, and the page says so where nobody can miss it.
#
# The page bundles the core package, so a change there changes the site even
# when nothing under apps/web has moved. That is why it is in the paths.

name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a run in progress finish rather than
# leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - name: Build the demo
        run: npm run build -w apps/web
        env:
          VITE_DEMO: '1'
          # A project site is served from /<repo>/, so the build needs the prefix.
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Fail if the recorded reports did not ship
        # The page is nothing without them, and an empty site would deploy silently.
        run: |
          test -s apps/web/dist/demo/bundle.json
          test -s apps/web/dist/demo/briefing.json
          test -s apps/web/dist/demo/wb.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
