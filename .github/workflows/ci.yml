# Typecheck, test and build on every push.
#
# The suite is designed to degrade rather than fail when something is
# absent: the Postgres tests skip without a database, and the document
# extraction tests skip without the owner's handbook, which is deliberately
# not in this repository. A database is provided here anyway, so the store
# contract runs against real Postgres and not only the in-memory
# implementation — those two have to behave identically and that is worth
# proving on every push.
#
# Nothing here reaches the network for weather or NOTAMs: every test replays
# recorded upstream responses committed alongside it.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the package declares, and the version it is developed on.
        node: ['20.x', '22.x']

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: holdshort
          POSTGRES_PASSWORD: holdshort
          POSTGRES_DB: holdshort
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U holdshort"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # Matches docker-compose, so the same URL works here and on a laptop.
          DATABASE_URL: postgres://holdshort:holdshort@localhost:5433/holdshort

      - name: Build the web app
        run: npm run build -w apps/web
