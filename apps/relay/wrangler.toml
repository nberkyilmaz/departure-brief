# The relay, as a Cloudflare Worker on the free plan. See docs/deploy.md.
name = "depbrief-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# Every five minutes. Each tick refreshes only what is due — METARs every
# five minutes, TAFs and hazard advisories every fifteen, upper winds hourly
# — which is 600 writes a day against the free plan's 1,000.
[triggers]
crons = ["*/5 * * * *"]

# Create it once with `npx wrangler kv namespace create SNAPSHOTS` and put
# the id it prints here.
[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "REPLACE_WITH_THE_ID_WRANGLER_PRINTS"

[vars]
# The pages allowed to read from this relay, comma separated. Add the
# custom domain here if one is ever attached.
ALLOWED_ORIGINS = "https://nberkyilmaz.github.io"
USER_AGENT = "depbrief-relay/0.1 (+https://github.com/nberkyilmaz/departure-brief)"
